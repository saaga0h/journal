services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    container_name: journal_postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=journal
      - POSTGRES_USER=journal
      - POSTGRES_PASSWORD=journal
    volumes:
      - journal_postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/01-extensions.sql
    restart: unless-stopped
    networks:
      - journal_network

  mosquitto:
    image: eclipse-mosquitto:2@sha256:9cfdd46ad59f3e3e5f592f6baf57ab23e1ad00605509d0f5c1e9b179c5314d87
    container_name: journal_mosquitto
    ports:
      - "1884:1883"
      - "9002:9001"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped
    networks:
      - journal_network

volumes:
  journal_postgres_data:
    driver: local
  mosquitto_data:
    driver: local

networks:
  journal_network:
    driver: bridge
